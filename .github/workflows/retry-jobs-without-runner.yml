name: Retry jobs without a runner

# GitHub cancels a job that waits 15 minutes for a runner, and macOS runners
# are sometimes that scarce: CI then failed although nothing had failed. When
# the only jobs of a CI run that did not succeed were cancelled before getting
# a runner, this re-runs them. If they get no runner again, it re-runs them a
# second time, and the pip-only job (ci.yml) then skips them: a skipped job
# does not fail CI.
#
# GitHub runs this workflow from master once a CI run completes, pull
# requests' included. It only reads the jobs of the run and re-runs them: it
# never checks out or runs the code of a pull request.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    name: Re-run jobs that got no runner
    runs-on: ubuntu-latest
    # A run with a job cancelled by GitHub concludes as a failure; one that
    # someone cancelled concludes as cancelled, and is left alone
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    steps:
      - name: Re-run them, if no other job failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          # The jobs of this attempt that did not succeed. A job cancelled
          # before getting a runner has no runner and no step.
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion != "success" and .conclusion != "skipped")')
          jq -r '"\(.name): \(.conclusion), runner \(.runner_name // "" | if . == "" then "none" else . end)"' <<< "$jobs"
          unsuccessful=$(jq -s 'length' <<< "$jobs")
          no_runner=$(jq -s '[.[] | select(.conclusion == "cancelled"
            and (.runner_id // 0) == 0 and ((.steps // []) | length) == 0)] | length' <<< "$jobs")
          if [ "$unsuccessful" -eq 0 ]; then
            echo "No job to re-run."
            exit 0
          elif [ "$no_runner" -ne "$unsuccessful" ]; then
            echo "Not re-run: a job failed, or was cancelled after getting a runner."
            exit 0
          fi
          gh run rerun "$RUN" --failed --repo "$GITHUB_REPOSITORY" \
            || echo "::warning::Could not re-run CI run $RUN: re-run its failed jobs by hand."
