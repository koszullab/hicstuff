name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: ruff check
        run: uvx ruff check src/

      - name: ruff format
        run: uvx ruff format --check src/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Experimental entries may fail without failing the workflow
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # Next Python release, allowed to fail. h5py has no cp315 wheel yet,
          # so it is built from source against the system HDF5.
          - python-version: "3.15"
            experimental: true
            extra-apt-packages: libhdf5-dev pkg-config

    steps:
      - uses: actions/checkout@v4

      # tabix provides bgzip, used to compress the final pairs file
      - name: Install system dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y bowtie2 bwa minimap2 samtools tabix
          ${{ matrix.extra-apt-packages }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: uv sync --extra dev

      - name: Check installed package
        run: uv run hicstuff --version

      - name: Run tests
        run: uv run pytest --cov=hicstuff --cov-report=term-missing --cov-report=xml -v

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
