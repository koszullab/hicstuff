name: Publish to PyPI and GHCR

on:
  push:
    tags:
      - "v*"

jobs:
  check-version:
    name: Check tag matches pyproject version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare tag with [project] version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "Tag version:       ${tag_version}"
          echo "pyproject version: ${project_version}"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${project_version}"
            exit 1
          fi

  build-and-publish:
    name: Build and publish
    needs: check-version
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        run: uv publish --token ${{ secrets.PYPI_TOKEN }}

  build-and-push-docker:
    name: Build and push Docker image to GHCR
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/hicstuff:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository_owner }}/hicstuff:latest
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hicstuff:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/hicstuff:buildcache,mode=max
