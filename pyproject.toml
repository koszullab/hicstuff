[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hicstuff"
version = "3.3.0"
description = "General purpose stuff to generate and handle Hi-C data in its simplest form."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Jacques Serizay", email = "jacques.serizay@pasteur.fr" },
    { name = "Cyril Matthey-Doret", email = "cyril.matthey-doret@pasteur.fr" },
    { name = "Lyam Baudry", email = "lyam.baudry@pasteur.fr" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
    "Operating System :: POSIX",
    "Operating System :: Unix",
    "Operating System :: MacOS",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas>=1.5.0",
    "matplotlib>=3.4.0",
    "rich-click>=1.7",
    "biopython",
    # pybwa links pysam's internals, and fails to import with pysam 0.22.
    # 2.3 builds bwa indexes with methods off by one, which hicstuff works around.
    "pybwa>=2.3.2,<2.4",
    "pysam>=0.23",
    "cooler",
    "click>=8.0",
    "python-dateutil",
    # 0.4.0 splits the QC block's contacts within a contig at 1001 bp, as
    # metaTOR's mge reads them.
    "metacooler>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "ipython>=8.12.3",
    "bump-my-version>=1.2",
]
# The documentation site (docs/, zensical.toml): `uv sync --extra docs`, then
# `uv run zensical serve`.
docs = [
    "zensical>=0.0.43",
    "mkdocstrings[python]>=0.25",
]

[project.urls]
Homepage = "https://github.com/koszullab/hicstuff"
Documentation = "https://koszullab.github.io/hicstuff"
Repository = "https://github.com/koszullab/hicstuff"
Changelog = "https://koszullab.github.io/hicstuff/changelog/"
Issues = "https://github.com/koszullab/hicstuff/issues"

[project.scripts]
hicstuff = "hicstuff.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hicstuff = ["*"]

[tool.bumpversion]
current_version = "3.3.0"
commit = true
tag = true
tag_name = "v{new_version}"
message = "chore(release): v{new_version}"
allow_dirty = false

# Each entry pins the hicstuff version only: the `name = "hicstuff"` anchor
# keeps the search off `current_version` above and off other packages in uv.lock.
[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "name = \"hicstuff\"\nversion = \"{current_version}\""
replace = "name = \"hicstuff\"\nversion = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "uv.lock"
search = "name = \"hicstuff\"\nversion = \"{current_version}\""
replace = "name = \"hicstuff\"\nversion = \"{new_version}\""

# The version the documentation's header and footer show.
[[tool.bumpversion.files]]
filename = "zensical.toml"
search = 'release = "{current_version}"'
replace = 'release = "{new_version}"'

# Turns the accumulated "Unreleased" entries into a dated section for this
# version, and opens an empty "Unreleased" above it for the next changes.
[[tool.bumpversion.files]]
filename = "docs/changelog.md"
search = "## Unreleased"
replace = "## Unreleased\n\n## {new_version} - {now:%Y-%m-%d}"

[[tool.bumpversion.files]]
filename = "Dockerfile"
search = "LABEL Name=hicstuff Version={current_version}"
replace = "LABEL Name=hicstuff Version={new_version}"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line-length handled by formatter
    "B008",   # function calls in default args
    "UP007",  # X | Y union syntax (py3.10+)
    "UP006",  # use `type` instead of `Type` (py3.9+)
    "UP035",  # import `Dict`, `List`... from `typing` (py3.9+), as UP006
    "B905",   # `zip()` without an explicit `strict=` (py3.10+)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["hicstuff"]
# _misc.py is archived experimental code that is no longer supported.
omit = ["*/tests/*", "*/hicstuff/_misc.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85
